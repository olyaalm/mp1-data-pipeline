# Configuring dataset checks and cleaning options for the pipeline.
validation:
  required_columns:
    - record_id
    - name
    - rating
    - category
    - status
  numeric_columns:
    - rating

processing:
  # Removing exact duplicate records while preserving the first occurrence.
  remove_duplicates: true

  # Removing records with missing values before checking outliers.
  missing:
    enabled: true
    axis: "rows"

  # Applying the IQR rule to the rating field.
  outliers:
    enabled: true
    columns:
      - rating
    method: "iqr"
    threshold: 1.5
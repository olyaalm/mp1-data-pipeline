# Configuring dataset checks and cleaning options for the pipeline.
validation:
  required_columns:
    - product
    - quantity
    - price
  numeric_columns:
    - quantity
    - price

processing:
  # Removing exact duplicate records while preserving the first occurrence.
  remove_duplicates: true

  # Removing records with missing values before checking outliers.
  missing:
    enabled: true
    axis: "rows"

  # Applying the IQR rule to the configured numeric field.
  outliers:
    enabled: true
    columns:
      - price
    method: "iqr"
    threshold: 1.5